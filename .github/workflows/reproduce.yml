name: Reproduce and audit both sites
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: reproduce-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest test_integrity -v
      - name: Refit both sites and compare against preserved references
        run: python reproduce.py --output reproduced
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-site-reproduction-audit
          path: |
            reproduced/*.json
            reproduced/*.log
            reproduced/danish/verification.json
            reproduced/danish/reproduction.json
            reproduced/german/external_verification.json
            reproduced/german/reproduction.json
