name: Reproduce both sites
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: reproduce-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Integrity tests
        run: python -m unittest discover -s tests -v
      - name: Rerun both sites and compare with the reference results
        run: python reproduce.py --output reproduced
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproduction-report
          path: |
            reproduced/*.json
            reproduced/*.log
            reproduced/denmark/verification.json
            reproduced/denmark/reproduction.json
            reproduced/germany/external_verification.json
            reproduced/germany/reproduction.json
